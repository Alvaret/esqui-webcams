<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f2f0e9;font-family:'Archivo',sans-serif;color:#15130f}
.topbar{background:#15130f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.brand{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.02em}
.live{background:#f7b32b;color:#15130f;font-weight:700;font-size:10px;letter-spacing:.18em;padding:5px 8px;border-radius:3px}
.intro{padding:18px 16px 6px}
h1{font-family:'Archivo Black',sans-serif;font-size:34px;line-height:1.02;text-transform:uppercase}
h1 em{font-style:normal;color:#d84a26}
.markers{display:flex;gap:8px;margin-top:12px}
.marker{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600}
.chip{width:26px;height:16px;border-radius:8px;display:inline-block}
.v{background:#1b7a43}.a{background:#e0a120}.r{background:#c0392b}
.searchbar{padding:12px 16px}
input{width:100%;border:2px solid #15130f;border-radius:6px;padding:13px 14px;font:600 15px 'Archivo';background:#fff}
.count{margin-left:16px;font-size:10px;letter-spacing:.16em;font-weight:700;margin-top:6px;display:block}
.list{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:#fff;border:2px solid #15130f;border-radius:8px;padding:10px;align-items:center}
.plate{width:58px;height:72px;flex:none;background:linear-gradient(#f2b70d 0 55%,#15130f 55% 100%);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#15130f}
.plate b{font-family:'Archivo Black';font-size:15px}
.plate span{font-size:8px;font-weight:800;letter-spacing:.08em;color:#f7d154}
.m{flex:1}
.m .k{font-size:9px;letter-spacing:.14em;color:#8a857a;font-weight:700}
.m .name{font-family:'Archivo Black';font-size:17px;margin:2px 0 4px}
.m .alt{font-size:12px;font-weight:600;color:#5c574d}
.webcam{flex:none;text-align:center}
.webcam .n{width:34px;height:34px;background:#15130f;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.webcam small{display:block;font-size:8px;letter-spacing:.1em;font-weight:700;margin-top:3px}
.card.hot .plate{background:linear-gradient(#d84a26 0 55%,#15130f 55% 100%)}
</style></head><body>
<div class="topbar"><span class="brand">PLWINTERCAM</span><span class="live">● EN DIRECTO</span></div>
<div class="intro">
<h1>La montaña,<br><em>ahora.</em></h1>
<div class="markers">
<span class="marker"><span class="chip v"></span>ABIERTA</span>
<span class="marker"><span class="chip a"></span>PARCIAL</span>
<span class="marker"><span class="chip r"></span>CERRADA</span>
</div></div>
<div class="searchbar"><input type="search" placeholder="Buscar estación"><span class="count">24 ESTACIONES</span></div>
<div class="list">
<div class="card hot"><span class="plate"><span>COTA</span><b>2260</b></span><span class="m"><span class="k">ESTACIÓN 01</span><span class="name">CANDANCHÚ</span><span class="alt">1.520 – 2.260 m</span></span><span class="webcam"><span class="n">2</span><small>CÁMARAS</small></span></div>
<div class="card"><span class="plate"><span>COTA</span><b>3398</b></span><span class="m"><span class="k">ESTACIÓN 02</span><span class="name">SIERRA NEVADA</span><span class="alt">2.100 – 3.398 m</span></span><span class="webcam"><span class="n">19</span><small>CÁMARAS</small></span></div>
<div class="card"><span class="plate"><span>COTA</span><b>2751</b></span><span class="m"><span class="k">ESTACIÓN 03</span><span class="name">BOÍ TAÜLL</span><span class="alt">1.770 – 2.751 m</span></span><span class="webcam"><span class="n">5</span><small>CÁMARAS</small></span></div>
<div class="card"><span class="plate"><span>COTA</span><b>2300</b></span><span class="m"><span class="k">ESTACIÓN 04</span><span class="name">ASTÚN</span><span class="alt">1.650 – 2.300 m</span></span><span class="webcam"><span class="n">7</span><small>CÁMARAS</small></span></div>
</div>
</body></html>
