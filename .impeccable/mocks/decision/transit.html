<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0b1f3a;color:#f3efe4;font-family:'Hanken Grotesk',sans-serif}
.top{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #22406b}
.brand{font-weight:800;font-size:15px;letter-spacing:.06em}
.net{font-size:10px;letter-spacing:.2em;color:#8fb3d9;font-weight:700}
.lines{display:flex;gap:6px;padding:14px 16px;overflow:hidden}
.line{height:26px;flex:none;border-radius:13px;background:#c8102e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;padding:0 12px}
.line.c{background:#0d5ea8}.line.a{background:#d99a1b}.line.g{background:#1d8a4b}
.intro{padding:4px 16px 10px}
h1{font-size:26px;font-weight:800;line-height:1.1}
.search{padding:10px 16px}
input{width:100%;background:#12325c;border:1px solid #2c4f80;border:1px solid #2c4f80;color:#f3efe4;border-radius:16px;padding:11px 14px;font:600 13px 'Hanken Grotesk'}
::placeholder{color:#8fb3d9}
.list{padding:6px 16px;display:flex;flex-direction:column;gap:10px}
.stn{display:flex;align-items:center;gap:12px;background:#0e2a4d;border:1px solid #22406b;border-radius:10px;padding:12px}
.dot{width:14px;height:14px;flex:none;border-radius:50%;background:#c8102e;border:3px solid #0e2a4d;outline:2px solid #c8102e}
.info{flex:1}
.name{font-weight:800;font-size:15px}
.alt{font-size:11px;color:#8fb3d9;font-weight:600;letter-spacing:.04em}
.tag{font-size:11px;font-weight:800;color:#f3efe4;background:#12325c;border:1px solid #2c4f80;border-radius:12px;padding:4px 10px}
</style></head><body>
<div class="top"><span class="brand">PLWINTERCAM</span><span class="net">RED · PIRINEOS</span></div>
<div class="lines"><span class="line">1</span><span class="line c">2</span><span class="line a">3</span><span class="line g">4</span><span class="line">5</span><span class="line c">6</span></div>
<div class="intro"><h1>La montaña, ahora.</h1></div>
<div class="search"><input placeholder="Buscar estación"></div>
<div class="list">
<div class="stn"><span class="dot"></span><span class="info"><div class="name">Candanchú</div><div class="alt">1.520 – 2.260 m</div></span><span class="tag">2 CÁMARAS</span></div>
<div class="stn"><span class="dot" style="background:#0d5ea8;outline-color:#0d5ea8"></span><span class="info"><div class="name">Sierra Nevada</div><div class="alt">2.100 – 3.398 m</div></span><span class="tag">19 CÁMARAS</span></div>
<div class="stn"><span class="dot" style="background:#d99a1b;outline-color:#d99a1b"></span><span class="info"><div class="name">Boí Taüll</div><div class="alt">1.770 – 2.751 m</div></span><span class="tag">5 CÁMARAS</span></div>
<div class="stn"><span class="dot" style="background:#1d8a4b;outline-color:#1d8a4b"></span><span class="info"><div class="name">Astún</div><div class="alt">1.650 – 2.300 m</div></span><span class="tag">7 CÁMARAS</span></div>
</div>
</body></html>
